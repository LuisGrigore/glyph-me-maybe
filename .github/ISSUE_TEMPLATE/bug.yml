name: "🐛 Bug Report"
description: Report incorrect or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide as much relevant information as possible so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe what is happening.
      placeholder: "When I try to..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Run...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: |
        Include relevant logs or error messages.
        Do not include passwords, tokens, API keys, or other secrets.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: App version, commit hash, or branch.
      placeholder: "v1.2.3"

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Development
        - Staging
        - Production
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other relevant information, screenshots, or context.